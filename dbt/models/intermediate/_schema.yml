version: 2

# Intermediate models sit between staging and marts.
# They join, aggregate, and reshape staging data into shapes that mart models
# can consume cleanly. Materialized as tables so mart queries are fast.
#
# Planned models (not yet built — implement after staging is validated):

models: []

