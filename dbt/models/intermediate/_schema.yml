#    interval: [valid_from, next_valid_from). Enables MTTR and open-volume-daily
#    calculations without repeated self-joins in mart models.
#
#  int_recurring_completions
#    Join tasks_pages to recurring_task_definitions_pages to identify which
#    completions belong to a recurring series. Enables adherence-rate KPIs.
#
#  int_task_active_days
#    For each task, compute the calendar days it spent in each status bucket
